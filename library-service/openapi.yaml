openapi: 3.0.3
info:
  title: Library Service API
  description: Manages the books of a home library, their reading status and ratings.
  version: 1.0.0

paths:
  /books/{id}:
    get:
      summary: Get a book by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found

    delete:
      summary: Delete a book by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Book deleted
        '404':
          description: Book not found


components:
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - author
        - readingStatus
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        genre:
          type: string
        readingStatus:
          type: string
          enum:
            - PENDING
            - READING
            - READ
        rating:
          type: integer
          minimum: 1
          maximum: 5


